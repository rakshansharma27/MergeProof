[pytest]
# Default discovery: only the project unit tests.
# demo/tests/ (intentional failure) and demo/tests_fixed/ (post-patch green)
# are run explicitly by the Streamlit test runner (test_runner.py) and can
# be targeted manually with:
#   python -m pytest demo/tests -q        ← 1 intentional failure
#   python -m pytest demo/tests_fixed -q  ← all green
testpaths = tests

# Suppress the "cannot collect TestRunResult" warning from schemas.py.
# TestRunResult starts with "Test" but is a Pydantic model, not a test class.
python_classes = Test
